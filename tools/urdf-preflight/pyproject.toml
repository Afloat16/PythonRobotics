[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urdf-preflight"
version = "0.1.0"
description = "Read-only, dependency-free URDF diagnostics for robot models and CI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Afloat16"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Environment :: Console",
]

[project.scripts]
urdf-preflight = "urdf_preflight.cli:main"

[tool.setuptools.packages.find]
include = ["urdf_preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
