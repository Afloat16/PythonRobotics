name: URDF Preflight
on:
  push:
    branches: ['feat/urdf-preflight']
    paths: ['tools/urdf-preflight/**', '.github/workflows/urdf-preflight.yml']
  pull_request:
    paths: ['tools/urdf-preflight/**', '.github/workflows/urdf-preflight.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/urdf-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m urdf_preflight examples/healthy.urdf --profile simulation --strict
      - run: python -m pip install .
      - run: urdf-preflight --version
